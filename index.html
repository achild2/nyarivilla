<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyarivilla - Booking Mudah & Cepat</title>
    <!-- Tailwind CSS untuk Layout Glassmorphism -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #app-container {
            position: fixed; inset: 0; z-index: 999999;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            overflow-y: auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .hidden-view { display: none !important; }
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
<div style="display:none;"><img src="https://placehold.co/600x400/1e3a8a/ffffff?text=Nyarivilla" alt="Nyarivilla"></div>

<div id="app-container">
    <!-- Header (Diperbarui dengan Elemen Logo Gambar) -->
    <header class="glass-panel sticky top-0 z-50 px-4 py-3 flex justify-between items-center text-blue-900 shadow-sm">
        <h1 class="font-bold text-xl flex items-center gap-2">
            <!-- Ikon rumah bawaan -->
            <i id="ui-app-icon" class="fa-solid fa-house-chimney"></i>
            <!-- Logo custom yang akan muncul jika diupload -->
            <img id="ui-app-logo" src="" class="h-8 w-8 object-cover rounded hidden shadow-sm border border-blue-200">
            <span id="ui-app-name">Nyarivilla</span>
        </h1>
        <div id="user-status" class="text-sm font-semibold">Tamu (Publik)</div>
    </header>

    <!-- Main Content Area -->
    <main class="p-4 mb-20">
        <!-- VIEWS: HOME -->
        <div id="view-home" class="view-section">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg text-blue-900">Katalog Villa</h2>
                <button onclick="cariLokasiGPS()" class="bg-blue-600 text-white text-xs px-3 py-2 rounded-full shadow hover:bg-blue-700 transition">
                    <i class="fa-solid fa-location-crosshairs"></i> Cari Terdekat
                </button>
            </div>
            <div id="katalog-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Data Katalog dimuat dari Google Sheets -->
            </div>
        </div>

        <!-- VIEWS: BOOKING FORM -->
        <div id="view-booking" class="view-section hidden-view max-w-md mx-auto">
            <button onclick="switchView('view-home')" class="mb-4 text-blue-600"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
            <div class="glass-panel rounded-2xl p-5">
                <h2 class="font-bold text-lg text-blue-900 mb-2">Form Pemesanan</h2>
                <h3 id="book-villa-name" class="font-semibold text-blue-700">Nama Villa</h3>
                <p id="book-villa-desc" class="text-xs text-gray-500 mb-4 italic line-clamp-2"></p>
                
                <div class="space-y-3">
                    <input type="hidden" id="book-villa-id">
                    <div>
                        <label class="text-xs text-gray-500">Nama Lengkap</label>
                        <input type="text" id="book-nama" class="w-full p-2 border rounded-lg" placeholder="Nama Pemesan">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">No. WhatsApp</label>
                        <input type="number" id="book-wa" class="w-full p-2 border rounded-lg" placeholder="08xxxxxxxx">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-500">Check-In</label>
                            <input type="date" id="book-in" onchange="kalkulasiHarga()" class="w-full p-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500">Check-Out</label>
                            <input type="date" id="book-out" onchange="kalkulasiHarga()" class="w-full p-2 border rounded-lg">
                        </div>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg mt-4">
                        <p class="text-xs text-gray-500">Rincian Tarif:</p>
                        <ul id="book-rincian" class="text-xs text-blue-800 list-disc pl-4 mb-2">Pilih tanggal untuk melihat harga</ul>
                        <div class="flex justify-between font-bold text-lg text-blue-900 border-t border-blue-200 pt-2">
                            <span>Total</span>
                            <span id="book-total">Rp 0</span>
                        </div>
                    </div>
                    <button onclick="prosesBooking()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg mt-4">Konfirmasi Pesanan</button>
                </div>
            </div>
        </div>

        <!-- VIEWS: LIVE CHAT -->
        <div id="view-chat" class="view-section hidden-view max-w-md mx-auto flex flex-col" style="height: 70vh;">
            <div class="glass-panel rounded-t-2xl p-3 border-b flex items-center justify-between">
                <h2 class="font-bold text-blue-900">Live Chat</h2>
                <div id="chat-identity-box" class="text-xs flex gap-1">
                    <input type="number" id="chat-wa-input" placeholder="No WA Anda" class="p-1 border rounded w-28">
                    <button onclick="mulaiChat()" class="bg-blue-600 text-white px-2 py-1 rounded">Mulai</button>
                </div>
            </div>
            <div id="chat-box" class="flex-1 bg-white p-3 overflow-y-auto space-y-2">
                <div class="text-center text-xs text-gray-400">Masukkan No WhatsApp untuk memulai obrolan dengan admin.</div>
            </div>
            <div class="glass-panel rounded-b-2xl p-2 flex gap-2">
                <input type="text" id="chat-msg" class="flex-1 p-2 border rounded-xl text-sm" placeholder="Ketik pesan..." disabled>
                <button onclick="kirimChat()" class="bg-blue-600 text-white px-4 rounded-xl" disabled id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- VIEWS: LOGIN / MEMBER -->
        <div id="view-login" class="view-section hidden-view max-w-sm mx-auto mt-10">
            <div class="glass-panel rounded-2xl p-6 text-center">
                <h2 class="font-bold text-xl text-blue-900 mb-4">Area Member / Admin</h2>
                <input type="text" id="log-user" class="w-full p-3 border rounded-xl mb-3 text-sm" placeholder="No. HP / Username">
                <input type="password" id="log-pass" class="w-full p-3 border rounded-xl mb-4 text-sm" placeholder="PIN / Password">
                <button onclick="prosesLogin()" class="w-full bg-blue-900 text-white font-bold py-3 rounded-xl shadow-lg mb-4">MASUK</button>
            </div>
        </div>

        <!-- VIEWS: ADMIN DASHBOARD -->
        <div id="view-admin" class="view-section hidden-view">
            <h2 class="font-bold text-xl text-blue-900 mb-4">Dashboard Admin</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <button onclick="showAdminForm('villa')" class="glass-panel p-4 rounded-2xl text-blue-900 text-center hover:bg-blue-50">
                    <i class="fa-solid fa-house-medical text-2xl mb-2"></i><br>Kelola Villa
                </button>
                <button onclick="loadAdminBookings()" class="glass-panel p-4 rounded-2xl text-blue-900 text-center hover:bg-blue-50">
                    <i class="fa-solid fa-calendar-check text-2xl mb-2"></i><br>Reservasi
                </button>
                <button onclick="showAdminForm('settings')" class="glass-panel p-4 rounded-2xl text-blue-900 text-center hover:bg-blue-50">
                    <i class="fa-solid fa-gear text-2xl mb-2"></i><br>Pengaturan
                </button>
                <button onclick="logout()" class="glass-panel p-4 rounded-2xl text-red-600 text-center hover:bg-red-50">
                    <i class="fa-solid fa-right-from-bracket text-2xl mb-2"></i><br>Keluar
                </button>
            </div>
            
            <div id="admin-workspace" class="glass-panel rounded-2xl p-5 border-blue-200">
                <p class="text-center text-gray-400 text-sm">Pilih menu di atas.</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="glass-panel fixed bottom-0 w-full flex justify-around text-xs text-blue-900 py-3 bottom-nav border-t z-50">
        <button onclick="switchView('view-home')" class="flex flex-col items-center gap-1 w-1/4">
            <i class="fa-solid fa-house text-lg"></i> Beranda
        </button>
        <button onclick="switchView('view-chat')" class="flex flex-col items-center gap-1 w-1/4">
            <i class="fa-solid fa-comments text-lg"></i> Live Chat
        </button>
        <button onclick="cekLoginStatus()" class="flex flex-col items-center gap-1 w-1/4">
            <i class="fa-solid fa-user text-lg"></i> Akun / Admin
        </button>
    </nav>
</div>

<!-- SCRIPT LOGIKA APLIKASI -->
<script>
    // URL GOOGLE APPS SCRIPT ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzdHJPkEwKoPCB9mR2w050ag3n7lkhy5zExQjnTXemHU0ysj31EISM14cCpoKC3F-8K/exec";

    let currentUser = null;
    let currentVillas = [];
    let appSettings = { nama_app: "Nyarivilla", info_admin: "", no_wa_admin: "", logo_url: "" };

    window.onload = () => {
        muatPengaturanDanKatalog();
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(el => {
            el.classList.add('hidden-view');
        });
        document.getElementById(viewId).classList.remove('hidden-view');
    }

    function cekLoginStatus() {
        if(!currentUser) {
            switchView('view-login');
        } else if(currentUser.role === 'admin') {
            switchView('view-admin');
        } else {
            alert(`Halo ${currentUser.nama}, Anda sudah masuk.`);
            switchView('view-home');
        }
    }

    async function muatPengaturanDanKatalog() {
        let container = document.getElementById('katalog-container');
        container.innerHTML = '<p class="text-sm text-center col-span-full py-10">Menghubungkan ke Google Sheets...</p>';
        
        try {
            let res = await fetch(`${GAS_URL}?action=getInitData`);
            let data = await res.json();
            
            if(data.settings) {
                appSettings = data.settings;
                document.getElementById('ui-app-name').innerText = appSettings.nama_app || "Nyarivilla";
                
                // --- PENAMBAHAN LOGIKA UNTUK MENAMPILKAN LOGO ---
                let logoImg = document.getElementById('ui-app-logo');
                let iconDefault = document.getElementById('ui-app-icon');
                
                if(appSettings.logo_url && appSettings.logo_url.startsWith('http')) {
                    logoImg.src = appSettings.logo_url;
                    logoImg.classList.remove('hidden'); // Munculkan logo gambar
                    iconDefault.classList.add('hidden'); // Sembunyikan ikon rumah
                } else {
                    logoImg.classList.add('hidden');
                    iconDefault.classList.remove('hidden');
                }
            }
            
            currentVillas = data.villas || [];
            tampilkanKatalog(currentVillas);
        } catch(e) {
            container.innerHTML = '<p class="text-sm text-center text-red-500 col-span-full py-10">Gagal memuat data dari Spreadsheet.</p>';
        }
    }

    function tampilkanKatalog(villas, coords = null) {
        let container = document.getElementById('katalog-container');
        container.innerHTML = '';
        if(villas.length === 0) {
            container.innerHTML = '<p class="text-sm text-center text-gray-500 col-span-full py-10">Belum ada data villa di Spreadsheet.</p>';
            return;
        }

        villas.forEach(v => {
            let jarakHTML = '';
            if(coords && v.kordinat_gps) {
                let [lat, lng] = v.kordinat_gps.split(',');
                let jarak = hitungJarak(coords.latitude, coords.longitude, parseFloat(lat), parseFloat(lng));
                jarakHTML = `<span class="absolute top-2 left-2 bg-green-500 text-white text-xs px-2 py-1 rounded-lg font-bold shadow">${jarak.toFixed(1)} km</span>`;
            }
            
            let hargaSeninKamis = v.harga_senin_kamis ? Number(v.harga_senin_kamis).toLocaleString('id-ID') : '0';
            let hargaSabtu = v.harga_sabtu ? Number(v.harga_sabtu).toLocaleString('id-ID') : '0';
            let hargaPromo = v.harga_promo ? Number(v.harga_promo) : 0;

            let hargaTampil = hargaPromo > 0 ? 
                `<strike class="text-gray-400 text-xs">Rp ${hargaSabtu}</strike><br><span class="text-red-600 font-bold">PROMO Rp ${hargaPromo.toLocaleString('id-ID')}</span>` : 
                `Mulai Rp ${hargaSeninKamis}`;

            container.innerHTML += `
                <div class="glass-panel rounded-2xl overflow-hidden relative shadow-sm">
                    ${jarakHTML}
                    <img src="${v.gambar_url || 'https://placehold.co/600x400/1e3a8a/ffffff?text=Nyarivilla'}" class="w-full h-40 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-blue-900">${v.nama_villa}</h3>
                        <p class="text-xs text-gray-500 mb-1"><i class="fa-solid fa-location-dot"></i> ${v.lokasi}</p>
                        <p class="text-xs text-gray-600 mb-2 italic line-clamp-2">${v.deskripsi || ''}</p>
                        <p class="text-sm mb-3">${hargaTampil}</p>
                        <button onclick="bukaFormBooking('${v.id}')" class="w-full bg-blue-100 text-blue-700 font-bold py-2 rounded-xl text-sm hover:bg-blue-600 hover:text-white transition">Pesan Sekarang</button>
                    </div>
                </div>
            `;
        });
    }

    function cariLokasiGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => tampilkanKatalog(currentVillas, position.coords),
                (error) => alert("Gagal mendapatkan lokasi GPS.")
            );
        } else { alert("GPS tidak didukung browser ini."); }
    }

    function hitungJarak(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function bukaFormBooking(idVilla) {
        let v = currentVillas.find(x => x.id == idVilla);
        if(!v) return;
        window.selectedVilla = v;
        document.getElementById('book-villa-id').value = v.id;
        document.getElementById('book-villa-name').innerText = v.nama_villa;
        document.getElementById('book-villa-desc').innerText = v.deskripsi || '';
        document.getElementById('book-total').innerText = 'Rp 0';
        document.getElementById('book-rincian').innerHTML = 'Pilih tanggal untuk melihat rincian tarif.';
        
        if(currentUser && currentUser.role !== 'admin') {
            document.getElementById('book-nama').value = currentUser.nama;
            document.getElementById('book-wa').value = currentUser.wa;
        }
        switchView('view-booking');
    }

    function kalkulasiHarga() {
        let din = document.getElementById('book-in').value;
        let dout = document.getElementById('book-out').value;
        if(!din || !dout || !window.selectedVilla) return;
        
        let d1 = new Date(din); let d2 = new Date(dout);
        if(d2 <= d1) { alert('Check-Out harus setelah Check-In'); return; }
        
        let v = window.selectedVilla;
        let total = 0; let rincian = '';
        let loopDate = new Date(d1);
        
        while(loopDate < d2) {
            let day = loopDate.getDay(); 
            let h = 0; let tipe = '';
            
            let promo = Number(v.harga_promo) || 0;
            if(promo > 0) {
                h = promo; tipe = "Harga Promo";
            } else if(day >= 1 && day <= 4) {
                h = Number(v.harga_senin_kamis) || 0; tipe = "Senin-Kamis";
            } else if(day === 5) {
                h = Number(v.harga_jumat) || 0; tipe = "Jumat";
            } else if(day === 6) {
                h = Number(v.harga_sabtu) || 0; tipe = "Sabtu";
            } else {
                h = Number(v.harga_minggu) || 0; tipe = "Minggu";
            }
            
            total += h;
            rincian += `<li>${loopDate.toLocaleDateString('id-ID')} (${tipe}): Rp ${h.toLocaleString('id-ID')}</li>`;
            loopDate.setDate(loopDate.getDate() + 1);
        }
        
        document.getElementById('book-rincian').innerHTML = rincian;
        document.getElementById('book-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        document.getElementById('book-total').setAttribute('data-harga', total);
    }

    async function prosesBooking() {
        let data = {
            action: 'bookVilla',
            villa_id: document.getElementById('book-villa-id').value,
            nama: document.getElementById('book-nama').value,
            wa: document.getElementById('book-wa').value,
            in: document.getElementById('book-in').value,
            out: document.getElementById('book-out').value,
            total: document.getElementById('book-total').getAttribute('data-harga') || 0
        };
        
        if(!data.nama || !data.wa || !data.in || !data.out) { alert("Lengkapi formulir pemesanan!"); return; }
        
        let btn = event.target;
        btn.innerText = "Mengirim...";
        try {
            let res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
            let msg = await res.text();
            alert(msg);
            switchView('view-home');
        } catch(e) {
            alert("Gagal mengirim pesanan ke server.");
        }
        btn.innerText = "Konfirmasi Pesanan";
    }

    function mulaiChat() {
        let wa = document.getElementById('chat-wa-input').value;
        if(!wa) { alert("Masukkan nomor WhatsApp terlebih dahulu."); return; }
        document.getElementById('chat-msg').removeAttribute('disabled');
        document.getElementById('btn-send-chat').removeAttribute('disabled');
        document.getElementById('chat-box').innerHTML = `<div class="text-xs text-center text-green-600 font-bold mb-2">Terhubung dengan Admin (WA: ${wa})</div>`;
    }

    function kirimChat() {
        let msgBox = document.getElementById('chat-msg');
        let chatBox = document.getElementById('chat-box');
        if(!msgBox.value) return;

        chatBox.innerHTML += `<div class="text-right"><span class="inline-block bg-blue-600 text-white text-xs p-2 rounded-xl">${msgBox.value}</span></div>`;
        msgBox.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function prosesLogin() {
        let u = document.getElementById('log-user').value;
        let p = document.getElementById('log-pass').value;
        if(!u || !p) { alert("Isi username dan password."); return; }

        try {
            let res = await fetch(`${GAS_URL}?action=login&u=${u}&p=${p}`);
            let data = await res.json();
            if(data.status === 'success') {
                currentUser = data.user;
                document.getElementById('user-status').innerText = data.user.role.toUpperCase();
                if(data.user.role === 'admin') switchView('view-admin'); else switchView('view-home');
            } else {
                alert("Login Gagal. Periksa kembali No HP / Password Anda.");
            }
        } catch(e) {
            alert("Gagal terhubung ke server Google Sheets.");
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('user-status').innerText = 'Tamu (Publik)';
        alert("Berhasil keluar.");
        switchView('view-home');
    }

    function showAdminForm(menu) {
        let ws = document.getElementById('admin-workspace');
        if(menu === 'villa') {
            ws.innerHTML = `
                <h3 class="font-bold mb-3 text-blue-900">Tambah Villa Baru & Upload Foto</h3>
                <input type="text" id="v-nama" placeholder="Nama Villa" class="w-full mb-2 p-2 border rounded text-sm">
                <input type="text" id="v-lokasi" placeholder="Lokasi (Contoh: Puncak, Bogor)" class="w-full mb-2 p-2 border rounded text-sm">
                <input type="text" id="v-gps" placeholder="Koordinat GPS (Contoh: -6.699,106.942)" class="w-full mb-2 p-2 border rounded text-sm">
                <textarea id="v-deskripsi" placeholder="Deskripsi & Fasilitas Villa" class="w-full mb-2 p-2 border rounded text-sm"></textarea>
                <div class="grid grid-cols-2 gap-2 mb-2 text-xs">
                    <input type="number" id="v-h1" placeholder="Harga Senin-Kamis" class="p-2 border rounded">
                    <input type="number" id="v-h2" placeholder="Harga Jumat" class="p-2 border rounded">
                    <input type="number" id="v-h3" placeholder="Harga Sabtu" class="p-2 border rounded">
                    <input type="number" id="v-h4" placeholder="Harga Minggu" class="p-2 border rounded">
                    <input type="number" id="v-h5" placeholder="Harga Promo" class="p-2 border rounded col-span-2">
                </div>
                <label class="text-xs text-gray-500">Pilih Foto dari Perangkat (HP / Komputer)</label>
                <input type="file" id="v-gambar" accept="image/*" class="w-full mb-3 text-xs p-1 border rounded bg-white">
                <button onclick="simpanVillaAdmin()" class="w-full bg-blue-600 text-white py-2 rounded-xl text-sm font-bold shadow">Simpan ke Google Sheets & Drive</button>
            `;
        } else if(menu === 'settings') {
            ws.innerHTML = `
                <h3 class="font-bold mb-3 text-blue-900">Pengaturan Aplikasi & Logo</h3>
                <input type="text" id="set-nama" value="${appSettings.nama_app || ''}" placeholder="Nama Aplikasi" class="w-full mb-2 p-2 border rounded text-sm">
                <input type="text" id="set-wa" value="${appSettings.no_wa_admin || ''}" placeholder="No WhatsApp Admin" class="w-full mb-2 p-2 border rounded text-sm">
                <textarea id="set-info" placeholder="Informasi / Deskripsi Admin" class="w-full mb-2 p-2 border rounded text-sm">${appSettings.info_admin || ''}</textarea>
                <label class="text-xs text-gray-500">Upload Logo Baru Aplikasi (HP / Komputer)</label>
                <input type="file" id="set-logo" accept="image/*" class="w-full mb-3 text-xs p-1 border rounded bg-white">
                <button onclick="simpanSettingAdmin()" class="w-full bg-green-600 text-white py-2 rounded-xl text-sm font-bold shadow">Simpan Pengaturan</button>
            `;
        }
    }

    async function simpanVillaAdmin() {
        let fileInput = document.getElementById('v-gambar');
        let nama = document.getElementById('v-nama').value;
        if(!nama) { alert("Nama villa wajib diisi."); return; }

        let payload = {
            action: "simpanVilla",
            nama: nama,
            lokasi: document.getElementById('v-lokasi').value || 'Indonesia',
            gps: document.getElementById('v-gps').value,
            deskripsi: document.getElementById('v-deskripsi').value || '-',
            h1: document.getElementById('v-h1').value || 0,
            h2: document.getElementById('v-h2').value || 0,
            h3: document.getElementById('v-h3').value || 0,
            h4: document.getElementById('v-h4').value || 0,
            h5: document.getElementById('v-h5').value || 0
        };

        if(fileInput.files.length > 0) {
            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = async function() {
                payload.filename = file.name;
                payload.mimeType = file.type;
                payload.filedata = reader.result.split(',')[1];
                kirimDataKeServer(payload);
            };
            reader.readAsDataURL(file);
        } else {
            kirimDataKeServer(payload);
        }
    }

    async function simpanSettingAdmin() {
        let fileInput = document.getElementById('set-logo');
        let payload = {
            action: "simpanSetting",
            nama_app: document.getElementById('set-nama').value,
            wa_admin: document.getElementById('set-wa').value,
            info_admin: document.getElementById('set-info').value
        };

        if(fileInput.files.length > 0) {
            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = async function() {
                payload.filename = file.name;
                payload.mimeType = file.type;
                payload.filedata = reader.result.split(',')[1];
                kirimDataKeServer(payload);
            };
            reader.readAsDataURL(file);
        } else {
            kirimDataKeServer(payload);
        }
    }

    async function kirimDataKeServer(payload) {
        alert("Mengunggah data ke Google Drive & Sheets...");
        try {
            let res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            let msg = await res.text();
            alert(msg);
            muatPengaturanDanKatalog();
            switchView('view-home');
        } catch(e) {
            alert("Gagal menyimpan data.");
        }
    }
</script>
