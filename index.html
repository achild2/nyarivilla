<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyarivilla - Pesan Vila & Resor Eksklusif</title>
    <!-- Tailwind CSS -->

    <!-- Font Inter & Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- PWA manifest & service worker injection via Data URI -->
    <script>
        const manifestData = {
            "name": "Nyarivilla Booking",
            "short_name": "Nyarivilla",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#059669",
            "icons": [{ "src": "https://placehold.co/192x192/1d4ed8/ffffff?text=N", "sizes": "192x192", "type": "image/png" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
    </script>

    <!-- KONFIGURASI GOOGLE SHEETS API -->
    <script>
        // Masukkan URL Web App Google Apps Script Anda di sini
        window.GS_CONFIG = {
            webAppUrl: "https://script.google.com/macros/s/AKfycbwW6KoM4gX-DJdVXB9MdA0NL7fwwgncXhBPAF8lgPKTfywgkX0wyf4UWu5OgLzx0PFDWw/exec",
            isMockMode: true // Set ke false jika URL Web App Google Sheets Anda sudah aktif
        };
    </script>

    <!-- Global App State -->
    <script>
        window.AppState = {
            currentView: 'explore', // explore, detail, checkout, my-bookings, admin, chat
            selectedVilla: null,
            user: null, // { name, role: 'admin'|'user' }
            searchQuery: {
                destination: '',
                checkIn: '',
                checkOut: '',
                guests: 1,
                userLat: null,
                userLng: null,
                radiusKm: 50
            },
            villas: [],
            bookings: [],
            chats: [
                { id: 'c-1', sender: 'Andi Pratama', role: 'user', message: 'Halo admin, apakah kolam renangnya air hangat?', timestamp: '10:30' },
                { id: 'c-2', sender: 'Admin Nyarivilla', role: 'admin', message: 'Halo Kak Andi, betul sekali! Kolam renang dilengkapi pemanas air.', timestamp: '10:32' }
            ],
            customLogoUrl: null,
            activeChatBookingId: null
        };
    </script>

    <!-- Header / Navbar Desktop & Tablet -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('explore')">
                <img id="appLogoImg" src="https://placehold.co/100x100/1d4ed8/ffffff?text=N" alt="Nyarivilla Logo" class="w-12 h-12 rounded-2xl object-cover shadow-md shadow-blue-500/20">
                <div>
                    <span class="text-2xl font-extrabold tracking-tight text-slate-900">Nyari<span class="text-blue-600">villa</span></span>
                    <span class="block text-[10px] text-slate-400 font-semibold uppercase tracking-widest">Resor & Villa Eksklusif</span>
                </div>
            </div>

            <!-- Navigation Links Desktop -->
    <nav class="hidden md:flex items-center space-x-6">
        <button onclick="switchView('explore')" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition flex items-center space-x-1.5 py-2">
            <i class="fa-solid fa-compass"></i><span>Jelajah</span>
        </button>
        <button onclick="switchView('my-bookings')" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition flex items-center space-x-1.5 py-2">
            <i class="fa-solid fa-ticket"></i><span>Pesanan Saya</span>
        </button>
        <button onclick="openLiveChat()" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition flex items-center space-x-1.5 py-2 relative">
            <i class="fa-solid fa-comments"></i><span>Live Chat</span>
            <span class="absolute -top-1 -right-2 bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">New</span>
        </button>
        <div id="desktopAuthNav" class="flex items-center space-x-3 pl-4 border-l border-slate-200">
            <!-- Dynamic Auth Rendered by JS -->
        </div>
    </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="mainAppContainer" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-28 md:pb-12">
        <!-- Views injected dynamically -->
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 px-6 py-2.5 flex justify-around items-center shadow-lg">
        <button onclick="switchView('explore')" id="navMobExplore" class="flex flex-col items-center text-blue-600 transition">
            <i class="fa-solid fa-compass text-lg mb-0.5"></i>
            <span class="text-[11px] font-medium">Jelajah</span>
        </button>
        <button onclick="switchView('my-bookings')" id="navMobBookings" class="flex flex-col items-center text-slate-400 hover:text-blue-600 transition">
            <i class="fa-solid fa-ticket text-lg mb-0.5"></i>
            <span class="text-[11px] font-medium">Pesanan</span>
        </button>
        <button onclick="openLiveChat()" class="flex flex-col items-center text-slate-400 hover:text-blue-600 transition">
            <i class="fa-solid fa-comments text-lg mb-0.5"></i>
            <span class="text-[11px] font-medium">Chat</span>
        </button>
        <button onclick="handleMobileAccountClick()" id="navMobAccount" class="flex flex-col items-center text-slate-400 hover:text-blue-600 transition">
            <i class="fa-solid fa-user text-lg mb-0.5"></i>
            <span id="navMobAccountLabel" class="text-[11px] font-medium">Akun</span>
        </button>
    </nav>

    <!-- FLOATING LIVE CHAT BUTTON -->
    <div class="fixed bottom-20 right-6 md:bottom-8 z-40">
        <button onclick="openLiveChat()" class="w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-2xl flex items-center justify-center text-xl transition transform hover:scale-105">
            <i class="fa-solid fa-headset"></i>
        </button>
    </div>
    <!-- MODAL LIVE CHAT -->
    <div id="liveChatModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full h-[85vh] flex flex-col shadow-2xl overflow-hidden relative">
            <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold">NV</div>
                    <div>
                        <h3 class="font-bold text-sm">Live Support Nyarivilla</h3>
                        <p class="text-[11px] text-emerald-400"><i class="fa-solid fa-circle text-[8px] mr-1"></i> Online</p>
                    </div>
                </div>
                <button onclick="closeLiveChat()" class="text-white hover:text-slate-200 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- Chat Messages Box -->
            <div id="chatMessagesContainer" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
                ${window.AppState.chats.map(c => `
                    <div class="flex flex-col ${c.role === 'admin' ? 'items-start' : 'items-end'}">
                        <span class="text-[10px] text-slate-400 mb-1 px-1">${c.sender} • ${c.timestamp}</span>
                        <div class="max-w-[80%] p-3.5 rounded-2xl text-sm shadow-xs ${c.role === 'admin' ? 'bg-white text-slate-800 border' : 'bg-blue-600 text-white'}">
                            ${c.message}
                        </div>
                    </div>
                `).join('')}
            </div>

            <!-- Chat Input Form -->
            <form onsubmit="sendChatMessage(event)" class="p-3 bg-white border-t flex items-center space-x-2">
                <input type="text" id="chatInputText" required placeholder="Tulis pesan ke admin..." class="flex-1 px-4 py-3 bg-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="w-12 h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-xl flex items-center justify-center shadow-md transition">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL CUSTOM NOTIFICATION -->
    <div id="customModalAlert" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div id="customModalIcon" class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 id="customModalTitle" class="text-lg font-bold text-slate-900 mb-1">Berhasil!</h4>
            <p id="customModalMessage" class="text-sm text-slate-500 mb-6">Pesan informasi sistem.</p>
            <button onclick="closeCustomModal()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition">
                Mengerti
            </button>
        </div>
    </div>

    <!-- MODAL TAMBAH VILA -->
    <div id="addVillaModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-8 shadow-2xl relative">
            <button onclick="closeAddVillaModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-xl font-extrabold text-slate-900 mb-1">Tambah Vila Baru & Upload Gambar</h3>
            <form onsubmit="submitNewVilla(event)" class="space-y-4 mt-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nama Vila</label>
                    <input type="text" id="newVillaName" required placeholder="cth: Nyarivilla Sunset" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Lokasi</label>
                    <input type="text" id="newVillaLocation" required placeholder="cth: Puncak, Bogor" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Harga (Rp/malam)</label>
                        <input type="number" id="newVillaPrice" required placeholder="1500000" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Max Tamu</label>
                        <input type="number" id="newVillaMaxGuests" required value="6" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Upload Gambar Vila (Dari Perangkat)</label>
                    <input type="file" id="newVillaImageFile" accept="image/*" onchange="previewVillaImage(event)" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <input type="hidden" id="newVillaImageUrl" value="https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=1000&q=80">
                    <div id="villaImagePreviewContainer" class="mt-3 hidden">
                        <img id="villaImagePreview" class="w-full h-36 object-cover rounded-xl border">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Deskripsi</label>
                    <textarea id="newVillaDesc" rows="3" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"></textarea>
                </div>
                <button type="submit" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg">Simpan ke Google Sheets</button>
            </form>
        </div>
    </div>

    <!-- SCRIPT APLIKASI UTAMA -->
    <script>
        const MOCK_VILLAS = [
            {
                id: 'v-1',
                name: 'Nyarivilla Panorama Puncak',
                location: 'Cisarua, Puncak, Bogor',
                lat: -6.6912,
                lng: 106.9452,
                price: 1850000,
                rating: 4.9,
                reviewsCount: 35,
                bedrooms: 4,
                bathrooms: 3,
                maxGuests: 10,
                image: 'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=1000&q=80',
                description: 'Vila mewah dengan panorama pegunungan menakjubkan dan kolam renang privat.'
            },
            {
                id: 'v-2',
                name: 'Green Bamboo Resort',
                location: 'Megamendung, Bogor',
                lat: -6.6541,
                lng: 106.9023,
                price: 1200000,
                rating: 4.7,
                reviewsCount: 19,
                bedrooms: 2,
                bathrooms: 2,
                maxGuests: 6,
                image: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1000&q=80',
                description: 'Vila kayu estetik asri di tengah sejuknya udara pegunungan.'
            }
        ];

        const MOCK_BOOKINGS = [
            {
                id: 'b-1',
                villaId: 'v-1',
                villaName: 'Nyarivilla Panorama Puncak',
                guestName: 'Andi Pratama',
                checkIn: '2026-06-12',
                checkOut: '2026-06-14',
                guests: 4,
                totalPrice: 3700000,
                status: 'Dikonfirmasi'
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadDataFromGoogleSheets();
        });

        async function loadDataFromGoogleSheets() {
            if (window.GS_CONFIG.isMockMode) {
                window.AppState.villas = MOCK_VILLAS;
                window.AppState.bookings = MOCK_BOOKINGS;
                initAppUI();
                return;
            }

            try {
                const response = await fetch(window.GS_CONFIG.webAppUrl + "?action=getData");
                const data = await response.json();
                window.AppState.villas = data.villas || MOCK_VILLAS;
                window.AppState.bookings = data.bookings || MOCK_BOOKINGS;
                initAppUI();
            } catch(e) {
                console.error("Gagal memuat dari Google Sheets:", e);
                window.AppState.villas = MOCK_VILLAS;
                window.AppState.bookings = MOCK_BOOKINGS;
                initAppUI();
            }
        }

        window.initAppUI = function() {
            updateNavbarAuthUI();
            renderCurrentView();
        }

        window.switchView = function(viewName, param = null) {
            window.AppState.currentView = viewName;
            if (viewName === 'detail' && param) {
                window.AppState.selectedVilla = window.AppState.villas.find(v => v.id === param);
            }
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderExploreView() {
            const query = window.AppState.searchQuery;
            let displayVillas = [...window.AppState.villas];

            if (query.destination) {
                const term = query.destination.toLowerCase();
                displayVillas = displayVillas.filter(v => v.name.toLowerCase().includes(term) || v.location.toLowerCase().includes(term));
            }

            if (query.userLat !== null && query.userLng !== null) {
                displayVillas.forEach(v => {
                    v.distance = calculateDistance(query.userLat, query.userLng, Number(v.lat), Number(v.lng));
                });
                displayVillas.sort((a, b) => a.distance - b.distance);
            }

            return `
                <div class="space-y-8">
                    <!-- Hero Banner & Search Bar -->
                    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden">
                        <div class="relative z-10 max-w-2xl space-y-3">
                            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Temukan Vila Impian Anda</h1>
                            <p class="text-sm text-blue-100">Jelajahi resor eksklusif dengan fasilitas terbaik di lokasi pilihan.</p>
                        </div>
                        <div class="mt-6 bg-white/10 backdrop-blur-md p-4 rounded-2xl grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
                            <div class="sm:col-span-5 relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                                <input type="text" id="searchInputDest" placeholder="Cari lokasi atau nama vila..." value="${query.destination}" oninput="window.AppState.searchQuery.destination = this.value" class="w-full pl-11 pr-4 py-3 bg-white text-slate-900 rounded-xl text-sm focus:outline-none">
                            </div>
                            <div class="sm:col-span-4">
                                <input type="number" placeholder="Max Tamu" value="${query.guests}" onchange="window.AppState.searchQuery.guests = this.value" class="w-full px-4 py-3 bg-white text-slate-900 rounded-xl text-sm focus:outline-none">
                            </div>
                            <div class="sm:col-span-3">
                                <button onclick="requestUserGPSLocation()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-xs">
                                    <i class="fa-solid fa-crosshairs"></i>
                                    <span>${query.userLat !== null ? 'GPS Aktif' : 'Gunakan GPS'}</span>
                                </button>
                            </div>
                        </div>
                        ${query.userLat !== null ? `<div class="mt-3 text-xs text-emerald-300 font-semibold"><i class="fa-solid fa-check-circle mr-1"></i> Menampilkan vila diurutkan dari yang terdekat dengan lokasi Anda.</div>` : ''}
                    </div>

                    <!-- Villa Cards Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${displayVillas.map(villa => `
                            <div onclick="switchView('detail', '${villa.id}')" class="bg-white rounded-3xl overflow-hidden border border-slate-200 hover:shadow-xl transition cursor-pointer flex flex-col relative">
                                ${villa.distance !== undefined ? `<span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-white text-[11px] font-bold px-3 py-1 rounded-full"><i class="fa-solid fa-location-arrow mr-1"></i>${villa.distance.toFixed(1)} km dari Anda</span>` : ''}
                                <div class="h-56 overflow-hidden">
                                    <img src="${villa.image}" class="w-full h-full object-cover">
                                </div>
                                <div class="p-5 flex-1 flex flex-col justify-between">
                                    <div>
                                        <span class="text-xs text-blue-600 font-bold">${villa.location}</span>
                                        <h3 class="font-extrabold text-slate-900 text-lg mt-1">${villa.name}</h3>
                                    </div>
                                    <div class="mt-4 pt-4 border-t flex justify-between items-center">
                                        <span class="text-lg font-extrabold text-blue-600">Rp ${Number(villa.price).toLocaleString('id-ID')}</span>
                                        <span class="px-4 py-2 bg-blue-50 text-blue-600 font-bold text-xs rounded-xl">Pesan</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCurrentView() {
            const container = document.getElementById('mainAppContainer');
            const view = window.AppState.currentView;

            if (view === 'explore') container.innerHTML = renderExploreView();
            else if (view === 'detail') container.innerHTML = renderDetailView();
            else if (view === 'checkout') container.innerHTML = renderCheckoutView();
            else if (view === 'my-bookings') container.innerHTML = renderMyBookingsView();
            else if (view === 'admin') container.innerHTML = renderAdminDashboardView();
        }
        window.openLiveChat = function() {
            document.getElementById('liveChatModal').classList.remove('hidden');
            const box = document.getElementById('chatMessagesContainer');
            box.scrollTop = box.scrollHeight;
        }

        window.closeLiveChat = function() {
            document.getElementById('liveChatModal').classList.add('hidden');
        }

        window.sendChatMessage = function(e) {
            e.preventDefault();
            const input = document.getElementById('chatInputText');
            const text = input.value.trim();
            if(!text) return;

            const senderName = window.AppState.user ? window.AppState.user.name : 'Tamu Pengunjung';
            const userRole = window.AppState.user && window.AppState.user.role === 'admin' ? 'admin' : 'user';

            window.AppState.chats.push({
                id: 'c-' + Date.now(),
                sender: senderName,
                role: userRole,
                message: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            input.value = '';
            
            // Re-render chat modal
            const box = document.getElementById('chatMessagesContainer');
            box.innerHTML = window.AppState.chats.map(c => `
                <div class="flex flex-col ${c.role === 'admin' ? 'items-start' : 'items-end'}">
                    <span class="text-[10px] text-slate-400 mb-1 px-1">${c.sender} • ${c.timestamp}</span>
                    <div class="max-w-[80%] p-3.5 rounded-2xl text-sm shadow-xs ${c.role === 'admin' ? 'bg-white text-slate-800 border' : 'bg-blue-600 text-white'}">
                        ${c.message}
                    </div>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function renderAdminDashboardView() {
            return `

        // Fungsi Kalkulator Jarak Haversine
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius bumi dalam kilometer
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    window.AppState.searchQuery.userLat = position.coords.latitude;
                    window.AppState.searchQuery.userLng = position.coords.longitude;
                    closeCustomModal();
                    renderCurrentView();
                },
                (error) => {
                    closeCustomModal();
                    showCustomModal("GPS Gagal", "Gagal mendapatkan lokasi GPS. Pastikan izin lokasi aktif.", "error");

                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Str = e.target.result;
                document.getElementById('newVillaImageUrl').value = base64Str;
                document.getElementById('villaImagePreview').src = base64Str;
                document.getElementById('villaImagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        window.handleLogoUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Logo = e.target.result;
                window.AppState.customLogoUrl = base64Logo;
                document.getElementById('appLogoImg').src = base64Logo;
                const adminPrev = document.getElementById('adminLogoPreview');
                if(adminPrev) adminPrev.src = base64Logo;
                showCustomModal("Berhasil", "Logo aplikasi berhasil diperbarui.", "success");
            };
            reader.readAsDataURL(file);
        }

            const booking = window.AppState.bookings.find(b => b.id === bookingId);
            if (booking) {
                booking.status = newStatus;
                renderCurrentView();
                showCustomModal("Berhasil", "Status pesanan & ketersediaan tanggal diperbarui.", "success");

            const maxGuests = document.getElementById('newVillaMaxGuests').value;

            const description = document.getElementById('newVillaDesc').value;

            const newV = { id: 'v-' + Date.now(), name, location, price, maxGuests, image, description };
            window.AppState.villas.unshift(newV);
            closeAddVillaModal();
            renderCurrentView();
            showCustomModal("Berhasil", "Vila baru ditambahkan.", "success");

        window.openAuthModal = () => document.getElementById('authModal').classList.remove('hidden');
        window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');
        window.setAuthTab = (type) => document.getElementById('authModeType').value = type;

        window.submitAuthForm = function(e) {
            e.preventDefault();
            const type = document.getElementById('authModeType').value;
            const name = document.getElementById('authName').value || (type === 'admin' ? 'Administrator' : 'Pengguna');
            const identifier = document.getElementById('authIdentifier').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (type === 'admin') {
                // Validasi ketat kredensial admin
                if (identifier !== 'admin@nyarivilla.com' || password !== 'Mania222@') {
                    showCustomModal("Akses Ditolak", "Akun lain tidak diizinkan masuk ke Dashboard Admin.", "error");
                    return;
                }

                window.AppState.user = { 
                    name: 'Admin Nyarivilla', 
                    email: 'admin@yarivilla.com',
                    role: 'admin' 
                };
                closeAuthModal();
                updateNavbarAuthUI();
                switchView('admin');
                showCustomModal("Admin Login", "Selamat datang di Panel Admin Nyarivilla.", "success");
            } else {
                window.AppState.user = { 
                    name: name || 'Tamu Pengunjung', 
                    email: identifier,
                    role: 'user' 
                };
                closeAuthModal();
                updateNavbarAuthUI();
                switchView('explore');
                showCustomModal("Login", "Berhasil masuk sebagai Tamu.", "success");
            }
        }

        window.handleMobileAccountClick = () => {
            if(!window.AppState.user) openAuthModal();
            else if(window.AppState.user.role === 'admin') switchView('admin');
            else showCustomModal("Akun", "Masuk sebagai: " + window.AppState.user.name, "success");

            } else {
                container.innerHTML = `<button onclick="openAuthModal()" class="px-5 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-md hover:bg-blue-700 transition">Masuk</button>`;
            }
        }

        window.setAuthTab = function(type) {
            document.getElementById('authModeType').value = type;
            const userBtn = document.getElementById('tabUserBtn');
            const adminBtn = document.getElementById('tabAdminBtn');
            const nameContainer = document.getElementById('userNameFieldContainer');
            const identifierField = document.getElementById('authIdentifier');

            window.AppState.user = null;
            updateNavbarAuthUI();

                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username / Email ID</label>
