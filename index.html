function formatRupiah(number) {
    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
}

function calculateTotalPrice(checkin, checkout, priceWd, priceWe) {
    let start = new Date(checkin);
    let end = new Date(checkout);
    if (start >= end) return 0;

    let total = 0;
    let current = new Date(start);
    while (current < end) {
        let day = current.getDay();
        // 0 = Minggu, 6 = Sabtu -> Weekend
        if (day === 0 || day === 6) {
            total += Number(priceWe);
        } else {
            total += Number(priceWd);
        }
        current.setDate(current.getDate() + 1);
    }
    return total;
}

// Menghitung jarak (Haversine formula) dalam KM
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Radius bumi dalam KM
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return (R * c).toFixed(1);
}

// Meminta akses GPS pengguna
function getLocation() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            reject("Geolokasi tidak didukung oleh browser/perangkat ini.");
        } else {
            navigator.geolocation.getCurrentPosition(
                (position) => resolve({lat: position.coords.latitude, lng: position.coords.longitude}),
                (error) => reject("Gagal mendapatkan lokasi. Pastikan GPS aktif dan izin browser diberikan.")
            );
        }
    });
}

/**
 * -----------------------------------------------------------------------------
 * API LAYER (Bridge: Preview vs Supabase)
 * -----------------------------------------------------------------------------
 */
const API = {
    async getSettings() {
        if (IS_PREVIEW) return appSettings;
        const { data, error } = await supabaseClient.from('settings').select('*').single();
        if (data) appSettings = data;
        return appSettings;
    },
    async updateSettings(newData, logoFile) {
        if (IS_PREVIEW) {
            appSettings = { ...appSettings, ...newData };
            if(logoFile) appSettings.logo_url = URL.createObjectURL(logoFile);
            return true;
        }
        try {
            let logo_url = appSettings.logo_url;
            if (logoFile) {
                const ext = logoFile.name.split('.').pop();
                const fileName = `logo_${Date.now()}.${ext}`;
                const { error: upErr } = await supabaseClient.storage.from('nyarivilla_assets').upload(fileName, logoFile);
                if (!upErr) {
                    const { data: pubUrl } = supabaseClient.storage.from('nyarivilla_assets').getPublicUrl(fileName);
                    logo_url = pubUrl.publicUrl;
                }
            }
            await supabaseClient.from('settings').update({ ...newData, logo_url }).eq('id', 1);
            return true;
        } catch (e) { showModal('Error', e.message); return false; }
    },
    async getVillas() {
        if (IS_PREVIEW) return dummyVillas;
        const { data } = await supabaseClient.from('villas').select('*').order('created_at', { ascending: false });
        return data || [];
    },
    async saveVilla(villa, file) {
        if (IS_PREVIEW) {
            if (file) villa.gambar_url = URL.createObjectURL(file);
            else villa.gambar_url = villa.gambar_url || 'https://placehold.co/600x400/94a3b8/ffffff?text=No+Image';
            
            if (villa.id) {
                let idx = dummyVillas.findIndex(v => v.id === villa.id);
                dummyVillas[idx] = { ...dummyVillas[idx], ...villa };
            } else {
                villa.id = 'v' + Date.now();
                dummyVillas.push(villa);
            }
            return true;
        }
        
        try {
            let gambar_url = villa.gambar_url;
            if (file) {
                const ext = file.name.split('.').pop();
                const fileName = `villa_${Date.now()}.${ext}`;
                const { error: upErr } = await supabaseClient.storage.from('nyarivilla_assets').upload(fileName, file);
                if (!upErr) {
                    const { data: pubUrl } = supabaseClient.storage.from('nyarivilla_assets').getPublicUrl(fileName);
                    gambar_url = pubUrl.publicUrl;
                }
            }
            if (villa.id) {
                await supabaseClient.from('villas').update({ ...villa, gambar_url }).eq('id', villa.id);
            } else {
                await supabaseClient.from('villas').insert([{ ...villa, gambar_url }]);
            }
            return true;
        } catch (e) { showModal('Error', e.message); return false; }
    },
    async deleteVilla(id) {
        if (IS_PREVIEW) { dummyVillas = dummyVillas.filter(v => v.id !== id); return true; }
        await supabaseClient.from('villas').delete().eq('id', id);
        return true;
    },
    async getBookings() {
        if (IS_PREVIEW) return dummyBookings;
        // Fetch bookings with villa details
        const { data } = await supabaseClient.from('bookings').select('*, villas(nama_villa), tamu(nama_lengkap, no_hp)').order('created_at', { ascending: false });
        return data || [];
    },
    async createBooking(booking) {
        if (IS_PREVIEW) {
            booking.id = 'b' + Date.now();
            booking.created_at = new Date().toISOString();
            booking.villas = { nama_villa: dummyVillas.find(v=>v.id===booking.villa_id)?.nama_villa };
            dummyBookings.push(booking);
            return true;
        }
        await supabaseClient.from('bookings').insert([booking]);
        return true;
    },
    async updateBookingStatus(id, status) {
        if (IS_PREVIEW) {
            let b = dummyBookings.find(x => x.id === id);
            if(b) b.status = status;
            return true;
        }
        await supabaseClient.from('bookings').update({status}).eq('id', id);
        return true;
    }
};

async function handleLogin(role, isPreviewBypass = false) {
    if (isPreviewBypass && IS_PREVIEW) {
        if (role === 'admin') {
            currentRole = 'admin';
            currentUser = { nama_lengkap: 'Administrator', id: 'admin1' };
        } else {
            currentRole = 'tamu';
            currentUser = dummyTamu[0];
        }
        await API.getSettings(); // Load app settings
        navigate('home');
        return;
    }

    const no_hp = document.getElementById('login-hp')?.value;
    const pin = document.getElementById('login-pin')?.value;
    
    if (role === 'admin') {
        // Admin via Supabase Auth (Email & Pass)
        const email = prompt("Masukkan Email Admin:");
        const pass = prompt("Masukkan Password Admin:");
        if(!email || !pass) return;
        
        if (IS_PREVIEW) {
            showModal("Mode Preview", "Login real Supabase dinonaktifkan di mode ini.");
        } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
            if (error) { showModal("Gagal Login", error.message); return; }
            currentRole = 'admin';
            currentUser = { nama_lengkap: 'Administrator' };
            await API.getSettings();
            navigate('home');
        }
    } else {
        // Tamu via custom table
        if (!no_hp || !pin) { showModal("Peringatan", "Harap isi No HP dan PIN."); return; }
        
        if (IS_PREVIEW) {
            let t = dummyTamu.find(x => x.no_hp === no_hp && x.pin_password === pin);
            if(t) {
                currentRole = 'tamu'; currentUser = t;
                await API.getSettings(); navigate('home');
            } else showModal("Gagal", "Kredensial tamu salah (Mode Preview).");
        } else {
            const { data, error } = await supabaseClient.from('tamu').select('*').eq('no_hp', no_hp).eq('pin_password', pin).single();
            if (error || !data) { showModal("Gagal", "No HP atau PIN salah."); return; }
            currentRole = 'tamu'; currentUser = data;
            await API.getSettings(); navigate('home');
        }
    }
}

        showModal("Sukses", "Registrasi berhasil, silakan login.");
    } else {
        const { error } = await supabaseClient.from('tamu').insert([{nama_lengkap: nama, no_hp: hp, pin_password: pin}]);
        if (error) showModal("Gagal", error.message);
        else showModal("Sukses", "Pendaftaran berhasil, silakan login.");
    }
}

function handleLogout() {

    currentUser = null;

    navigate('login');

function calculateBookingPreview() {
    const ci = document.getElementById('book-checkin').value;
    const co = document.getElementById('book-checkout').value;
    if(ci && co && currentSelectedVilla) {
        const total = calculateTotalPrice(ci, co, currentSelectedVilla.harga_weekdays, currentSelectedVilla.harga_weekend);
        document.getElementById('book-total').innerText = formatRupiah(total);
    }
}

async function submitBooking() {
    const ci = document.getElementById('book-checkin').value;
    const co = document.getElementById('book-checkout').value;
    if(!ci || !co) { showModal('Peringatan', 'Harap lengkapi tanggal check-in dan check-out.'); return; }
    if(new Date(ci) >= new Date(co)) { showModal('Peringatan', 'Tanggal check-out harus setelah check-in.'); return; }

    const total = calculateTotalPrice(ci, co, currentSelectedVilla.harga_weekdays, currentSelectedVilla.harga_weekend);
    
    // Cek Ketersediaan Sederhana (Apakah ada status confirmed/blocked di tanggal yang bersinggungan)
    const allB = await API.getBookings();
    const isConflict = allB.some(b => 
        b.villa_id === currentSelectedVilla.id && 
        b.status !== 'pending' &&
        ((ci >= b.tgl_checkin && ci < b.tgl_checkout) || (co > b.tgl_checkin && co <= b.tgl_checkout))
    );

    if(isConflict) {
        showModal('Mohon Maaf', 'Tanggal tersebut sudah terpesan atau diblokir. Silakan pilih tanggal lain.');
        return;
    }

    const payload = {
        tamu_id: currentUser.id,
        villa_id: currentSelectedVilla.id,
        tgl_checkin: ci,
        tgl_checkout: co,
        total_harga: total,
        status: 'pending'
    };

    const res = await API.createBooking(payload);
    if(res) {
        document.getElementById('villa-detail-modal').remove();
        showModal('Berhasil', 'Pesanan berhasil dibuat! Silakan cek menu Pesanan untuk melihat status.');
        navigate('bookings');
    }
}

                        <input type="file" id="fv-file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <button type="submit" class="w-full mt-4 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-500/30">Simpan Data</button>
                </form>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

async function simpanVilla(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.innerText = 'Menyimpan...'; btn.disabled = true;

    const payload = {
        id: editVillaId,
        nama_villa: document.getElementById('fv-nama').value,
        lokasi: document.getElementById('fv-lokasi').value,
        kordinat_gps: document.getElementById('fv-gps').value,
        harga_weekdays: document.getElementById('fv-hwd').value,
        harga_weekend: document.getElementById('fv-hwe').value,
        deskripsi: document.getElementById('fv-desk').value,
    };
    const file = document.getElementById('fv-file').files[0];

    const res = await API.saveVilla(payload, file);
    if(res) {
        document.getElementById('form-villa-modal').remove();
        renderApp();
    }
}

async function hapusVilla(id) {
    if(confirm("Yakin ingin menghapus villa ini secara permanen?")) {
        await API.deleteVilla(id);
        renderApp();
    }
}

async function showFormBlokir() {
    const villas = await API.getVillas();
    const modalHtml = `
        <div id="form-blokir-modal" class="modal-overlay z-[150]" style="display:flex">
            <div class="bg-white w-full max-w-md p-6 rounded-3xl shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-900">Blokir Tanggal Ketersediaan</h2>
                    <button onclick="document.getElementById('form-blokir-modal').remove()" class="text-gray-400"><i class="ph ph-x text-2xl"></i></button>
                </div>
                <form onsubmit="simpanBlokir(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih Villa</label>
                        <select id="fb-villa" required class="w-full p-3 rounded-xl border border-gray-200 outline-none bg-white">
                            ${villas.map(v => `<option value="${v.id}">${v.nama_villa}</option>`).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Mulai Tanggal</label>
                            <input type="date" id="fb-start" required class="w-full p-3 rounded-xl border border-gray-200 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Sampai Tanggal</label>
                            <input type="date" id="fb-end" required class="w-full p-3 rounded-xl border border-gray-200 outline-none">
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 leading-tight mb-2">Tanggal yang diblokir tidak akan bisa dipesan oleh tamu. Berguna saat renovasi atau pemakaian pribadi.</p>

                </form>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);

async function simpanBlokir(e) {
    e.preventDefault();
    const payload = {
        villa_id: document.getElementById('fb-villa').value,
        tgl_checkin: document.getElementById('fb-start').value,
        tgl_checkout: document.getElementById('fb-end').value,
        status: 'blocked',
        total_harga: 0,
        tamu_id: null // Admin bypass
    };
    if(payload.tgl_checkin >= payload.tgl_checkout) {
        showModal('Error', 'Tanggal akhir harus lebih besar dari tanggal mulai.'); return;
    }
    await API.createBooking(payload);
    document.getElementById('form-blokir-modal').remove();
    navigate('bookings'); // Arahkan ke daftar pesanan untuk melihat hasil blokir
}

async function renderViewSettings() {
    let content = `
        <div class="p-6 md:p-10 max-w-3xl mx-auto">
            <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-2">Pengaturan Aplikasi</h1>

                        <div class="w-24 h-24 rounded-2xl bg-gray-100 border-2 border-dashed border-gray-300 flex-shrink-0 overflow-hidden relative group">
                            <img src="${appSettings.logo_url}" class="w-full h-full object-cover">

                                <i class="ph ph-camera text-white text-2xl"></i>
                            </div>
                            <input type="file" id="set-logo" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                        </div>
                        <div class="flex-1 w-full space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Aplikasi</label>
                                <input type="text" id="set-nama" value="${appSettings.nama_app}" required class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Nomor WhatsApp CS/Admin</label>
                                <input type="tel" id="set-wa" value="${appSettings.no_wa_admin}" required class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:border-blue-500">
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Informasi Singkat / Slogan</label>
                        <textarea id="set-info" rows="2" class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:border-blue-500">${appSettings.info_admin}</textarea>
                    </div>

                    <button type="submit" class="w-full md:w-auto px-8 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition shadow-lg">Simpan Perubahan</button>
                </form>

async function simpanSettings(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.innerText = 'Menyimpan...'; btn.disabled = true;

    const payload = {
        nama_app: document.getElementById('set-nama').value,
        no_wa_admin: document.getElementById('set-wa').value,
        info_admin: document.getElementById('set-info').value
    };
    const file = document.getElementById('set-logo').files[0];

    const res = await API.updateSettings(payload, file);
    if(res) {
        showModal('Sukses', 'Pengaturan berhasil diperbarui.');
        renderApp(); // re-render to update sidebar logo
    } else {
        btn.innerText = 'Simpan Perubahan'; btn.disabled = false;
    }
}


/**
 * -----------------------------------------------------------------------------
 * MAIN RENDER CONTROLLER
 * -----------------------------------------------------------------------------
 */
async function renderApp() {
    const root = document.getElementById('root');
    
    // Jika belum login, tampilkan layar login
    if (currentRole === 'guest') {
        root.innerHTML = renderLogin();
        return;
    }

    // Ambil konten view aktif
    let mainContentHtml = '';
    if (currentView === 'home') mainContentHtml = await renderViewHome();
    else if (currentView === 'villas' && currentRole === 'admin') mainContentHtml = await renderViewVillas();
    else if (currentView === 'bookings') mainContentHtml = await renderViewBookings();
    else if (currentView === 'settings' && currentRole === 'admin') mainContentHtml = await renderViewSettings();
    else mainContentHtml = `<div class="p-10 text-center text-gray-500">View tidak ditemukan atau akses ditolak.</div>`;

    root.innerHTML = `
        ${renderPreviewBanner()}
        <div id="app-container" class="${IS_PREVIEW ? 'pt-8' : ''}">
            ${renderSidebar()}
            <div id="main-content">
                ${mainContentHtml}
            </div>
            ${renderBottomNav()}
        </div>
    `;
}

// Inisialisasi awal
document.addEventListener('DOMContentLoaded', () => {
    // Inject Custom Animations Style dynamically
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity:0; } to { transform: scale(1); opacity:1; } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-scale-up { animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    `;
    document.head.appendChild(style);
    
    renderApp();
});
</script>
